# 通用 PS5 资产 profile (v1.2.3 多阶梯自适应超兼容版)
# 融合 theghostonline 启发式内核精髓：
# 1. 默认通用大资产：128 KiB mixed 混合分块
# 2. 纹理与游戏大资产：64 KiB mixed 页面对齐分块（契合 PS5 64KB Direct IO 物理页面）
# 3. 散装音频音效资产：16 KiB random 极小分块 + hot 热数据低延迟标记（消除瞬时解压卡顿与爆音）
# 4. 全方位安全 Loose 网：可执行体、系统目录、运行时代码、视频与无后缀流式媒体容器全面直通

[pack]
index_name = "ampr_assets.index"
pack_pattern = "ampr_assets-{group}-lane{lane:02d}-vol{volume:02d}-{id:03d}.pak"

# ⚠️ 默认 compress！摸不清游戏的最佳起手姿势
default_action = "compress"
default_block_size = "128KiB"

# f_iosize 64 KiB 在 PS5 目标文件系统
io_page_size = "64KiB"
payload_alignment = "64KiB"
chunk_alignment = "64B"

workers = 4
compression_mode = "hc"          # fast | hc
compression_level = 9
acceleration = 1
deduplicate = true
deduplicate_scope = "lane"
deduplicate_streaming = false
min_savings_bytes = 64
min_savings_ratio = 0.01

io_neutral_min_savings_bytes = "8KiB"
io_neutral_min_savings_ratio = 0.125

# 关键：auto_loose 自动跳过已压缩格式（dds/ktx/wem/mp4/zip/pak）的节省 <5% 的
auto_loose_large_files = true
auto_loose_hot_files = false
auto_loose_min_file_size = "64MiB"
auto_loose_sample_blocks = 32
auto_loose_sample_bytes = "16MiB"
auto_loose_min_savings_ratio = 0.05
auto_loose_max_raw_ratio = 0.90

preserve_mtime = true
validate_index_metadata = true

[runtime]
decoded_cache_bytes = "128MiB"
physical_cache_bytes = "64MiB"
workers = 8
latency_reserve_workers = 1

[groups.assets]
pack_count = 4
assignment = "balanced"
max_pack_size = "16GiB"
stripe_large_files = false

# 1) 普通大资产压缩 (默认 128 KiB 混合布局)
[[rule]]
action = "compress"
group = "assets"
include = ["**"]
layout = "mixed"

# 2) 纹理与游戏大资产优化 (64 KiB 分块契约，对齐 PS5 64KB Direct IO 页面)
[[rule]]
action = "compress"
group = "assets"
block_size = "64KiB"
layout = "mixed"
include = [
    "**/*.uasset", "**/*.ubulk", "**/*.bin",
    "**/*.res"
]

# 3) 音频与音效资产优化 (16 KiB 极小分块 + 随机低延迟布局 + 热数据标记，防掉帧爆音)
[[rule]]
action = "compress"
group = "assets"
block_size = "16KiB"
layout = "random"
hot = true
min_savings_ratio = 0.0025
include = [
    "**/sound/**", "**/audio/**", "**/sfx/**", "**/music/**", "**/voice/**",
    "**/vo/**", "**/dialog/**", "**/dialogue/**"
]

# 4) loose 安全网（兜底保护：开机核心、可执行代码、视频、音频、配置及已压缩格式）
# 规则说明：由于 fnmatch 机制中 '**/xxx' 不匹配根目录文件，因此所有模式均同时声明 'xxx' 与 '**/xxx'
[[rule]]
action = "loose"
group = "assets"
include = [
    # 1. 签名与可执行入口（PS5 OS 加载必需）
    "eboot.bin", "**/eboot.bin",
    "*.elf", "**/*.elf",
    "*.self", "**/*.self",
    "*.prx", "**/*.prx",
    "*.sprx", "**/*.sprx",
    "sce_module/**", "**/sce_module/**",
    "sce_sys/**", "**/sce_sys/**",
    "fakelib/**", "**/fakelib/**",
    "system/**", "**/system/**",
    "decrypted/**", "**/decrypted/**",
    "mods/**", "**/mods/**",
    "save/**", "**/save/**",
    "_DUPLEX_/**", "**/_DUPLEX_/**",
    "trophy2/**", "**/trophy2/**",
    "uds/**", "**/uds/**",

    # 2. 游戏代码运行时核心（Unity / Capcom RE Engine / 虚幻引擎 / 索尼第一方引擎代码引导）
    "*.rds", "**/*.rds",
    "runtime_il2cppMasterPS5.rds", "**/runtime_il2cppMasterPS5.rds",
    "*.args", "**/*.args",
    "natives/**", "**/natives/**",
    "*.utoc", "**/*.utoc",
    "*.cache", "**/*.cache",
    "*.odx", "**/*.odx",
    "*.odxb", "**/*.odxb",

    # 3. 签名凭据、存档 Key 与内部索引
    "keystone", "**/keystone",
    "nptitle.dat", "**/nptitle.dat",
    "ampr_emu.index", "**/ampr_emu.index",
    "ampr_assets.index", "**/ampr_assets.index",
    "ampr_assets.index.crc", "**/ampr_assets.index.crc",
    "ampr_assets.index.runtime", "**/ampr_assets.index.runtime",
    "ampr_assets-*.pak", "**/ampr_assets-*.pak",

    # 4. 开机敏感视频与动画容器（底层通过 mmap 直读，必须 loose 否则开机启动图后死锁）
    "*.bk2", "**/*.bk2",
    "*.usm", "**/*.usm",
    "*.ivf", "**/*.ivf",
    "*.mp4", "**/*.mp4",
    "*.m4v", "**/*.m4v",
    "*.mkv", "**/*.mkv",
    "*.avi", "**/*.avi",
    "*.webm", "**/*.webm",
    "video/**", "**/video/**",
    "movie/**", "**/movie/**",
    "movies/**", "**/movies/**",
    "cutscene/**", "**/cutscene/**",
    "cutscenes/**", "**/cutscenes/**",
    "fmv/**", "**/fmv/**",
    "cinematic/**", "**/cinematic/**",
    "cinematics/**", "**/cinematics/**",
    "**/movie", "**/movie_*",
    "**/movies", "**/movies_*",

    # 5. 音频容器与 SoundBank（开机期直接读取）
    "*.bnk", "**/*.bnk",
    "*.wem", "**/*.wem",
    "*.at9", "**/*.at9",
    "*.sxd", "**/*.sxd",
    "*.ogg", "**/*.ogg",
    "*.opus", "**/*.opus",
    "*.flac", "**/*.flac",
    "*.mp3", "**/*.mp3",
    "*.aac", "**/*.aac",
    "*.m4a", "**/*.m4a",
    "soundbank/**", "**/soundbank/**",
    "**/soundbank", "**/soundbank_*",
    "**/screenreaderwem", "**/screenreaderwem.*",
    "**/wem", "**/wem_*", "**/wem.*",

    # 6. 配置文件、数据表与脚本（轻量级，明文直读）
    "*.ini", "**/*.ini",
    "*.cfg", "**/*.cfg",
    "*.json", "**/*.json",
    "*.xml", "**/*.xml",
    "*.txt", "**/*.txt",
    "*.dat", "**/*.dat",
    "*.bak", "**/*.bak",
    "*.pfs", "**/*.pfs",
    "*.url", "**/*.url",
    "*.sfx", "**/*.sfx",
    "param.sfx", "**/param.sfx",

    # 7. 贴图与已压缩格式（LZ4 零压缩收益）
    "*.png", "**/*.png",
    "*.jpg", "**/*.jpg",
    "*.jpeg", "**/*.jpeg",
    "*.webp", "**/*.webp",
    "*.dds", "**/*.dds",
    "*.ktx", "**/*.ktx",
    "*.ktx2", "**/*.ktx2",
    "*.otf", "**/*.otf",
    "*.ttf", "**/*.ttf",
]
