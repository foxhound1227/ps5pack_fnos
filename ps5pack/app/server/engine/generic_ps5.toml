# 通用 PS5 资产 profile — 未 trace 过的新游戏用这个
# default_action = "compress" 把所有文件尝试压
# auto_loose_* 自动 fallback：节省 <5% 自动转 loose（不浪费 CPU）
# 最后一条 rule 把 runtime/loader/签名相关的目录 loose 兜底安全

[pack]
index_name = "ampr_assets.index"
pack_pattern = "ampr_assets-{group}-lane{lane:02d}-vol{volume:02d}-{id:03d}.pak"

# ⚠️ 默认 compress！摸不清游戏的最佳起手姿势
default_action = "compress"
default_block_size = "128KiB"

# f_iosize 64 KiB 在 PS5 目标文件系统
io_page_size = "64KiB"
payload_alignment = "64KiB"
chunk_alignment = "64B"

workers = 4
compression_mode = "hc"          # fast | hc
compression_level = 9
acceleration = 1
deduplicate = true
deduplicate_scope = "lane"
deduplicate_streaming = false
min_savings_bytes = 64
min_savings_ratio = 0.01

io_neutral_min_savings_bytes = "8KiB"
io_neutral_min_savings_ratio = 0.125

# 关键：auto_loose 自动跳过已压缩格式（dds/ktx/wem/mp4/zip/pak）的节省 <5% 的
auto_loose_large_files = true
auto_loose_hot_files = false
auto_loose_min_file_size = "64MiB"
auto_loose_sample_blocks = 32
auto_loose_sample_bytes = "16MiB"
auto_loose_min_savings_ratio = 0.05
auto_loose_max_raw_ratio = 0.90

preserve_mtime = true
validate_index_metadata = true

[runtime]
decoded_cache_bytes = "128MiB"
physical_cache_bytes = "64MiB"
workers = 4
latency_reserve_workers = 1

[groups.assets]
pack_count = 4
assignment = "balanced"
max_pack_size = "16GiB"
stripe_large_files = false

# 1) 先 compress 兜底：所有文件尝试 pack（除非被下面 loose 命中）
#    group = "assets" + [groups.assets] pack_count=4 让产物拆 4 lane（之前 default group 单 lane 是死配置）
[[rule]]
action = "compress"
group = "assets"
include = ["**"]
layout = "mixed"

# 2) loose 安全网（兜底保护：开机核心、可执行代码、视频、音频、配置及已压缩格式）
# 规则说明：由于 fnmatch 机制中 '**/xxx' 不匹配根目录文件，因此所有模式均同时声明 'xxx' 与 '**/xxx'
[[rule]]
action = "loose"
group = "assets"
include = [
    # 1. 签名与可执行入口（PS5 OS 加载必需）
    "eboot.bin", "**/eboot.bin",
    "*.elf", "**/*.elf",
    "*.self", "**/*.self",
    "*.prx", "**/*.prx",
    "*.sprx", "**/*.sprx",
    "sce_module/**", "**/sce_module/**",
    "sce_sys/**", "**/sce_sys/**",
    "fakelib/**", "**/fakelib/**",
    "system/**", "**/system/**",
    "decrypted/**", "**/decrypted/**",
    "mods/**", "**/mods/**",
    "save/**", "**/save/**",
    "_DUPLEX_/**", "**/_DUPLEX_/**",
    "trophy2/**", "**/trophy2/**",
    "uds/**", "**/uds/**",

    # 2. 游戏代码运行时核心（Unity / Capcom RE Engine / 虚幻引擎代码引导）
    "*.rds", "**/*.rds",
    "runtime_il2cppMasterPS5.rds", "**/runtime_il2cppMasterPS5.rds",
    "*.args", "**/*.args",
    "natives/**", "**/natives/**",
    "*.utoc", "**/*.utoc",

    # 3. 签名凭据、存档 Key 与内部索引
    "keystone", "**/keystone",
    "nptitle.dat", "**/nptitle.dat",
    "ampr_emu.index", "**/ampr_emu.index",
    "ampr_assets.index", "**/ampr_assets.index",
    "ampr_assets.index.crc", "**/ampr_assets.index.crc",
    "ampr_assets.index.runtime", "**/ampr_assets.index.runtime",
    "ampr_assets-*.pak", "**/ampr_assets-*.pak",

    # 4. 开机敏感视频与动画容器（底通过 mmap 直读，必须 loose 否则开机启动图后死锁）
    "*.bk2", "**/*.bk2",
    "*.usm", "**/*.usm",
    "*.ivf", "**/*.ivf",
    "*.mp4", "**/*.mp4",
    "*.m4v", "**/*.m4v",
    "*.mkv", "**/*.mkv",
    "*.avi", "**/*.avi",
    "*.webm", "**/*.webm",
    "video/**", "**/video/**",
    "movie/**", "**/movie/**",
    "movies/**", "**/movies/**",
    "cutscene/**", "**/cutscene/**",
    "cutscenes/**", "**/cutscenes/**",
    "fmv/**", "**/fmv/**",
    "cinematic/**", "**/cinematic/**",
    "cinematics/**", "**/cinematics/**",

    # 5. 音频容器与 SoundBank（开机期直接读取）
    "*.bnk", "**/*.bnk",
    "*.wem", "**/*.wem",
    "*.at9", "**/*.at9",
    "*.ogg", "**/*.ogg",
    "*.opus", "**/*.opus",
    "*.flac", "**/*.flac",
    "*.mp3", "**/*.mp3",
    "*.aac", "**/*.aac",
    "*.m4a", "**/*.m4a",
    "soundbank/**", "**/soundbank/**",

    # 6. 配置文件、数据表与脚本（轻量级，明文直读）
    "*.ini", "**/*.ini",
    "*.cfg", "**/*.cfg",
    "*.json", "**/*.json",
    "*.xml", "**/*.xml",
    "*.txt", "**/*.txt",
    "*.dat", "**/*.dat",
    "*.bak", "**/*.bak",
    "*.pfs", "**/*.pfs",
    "*.url", "**/*.url",

    # 7. 贴图与已压缩格式（LZ4 零压缩收益）
    "*.png", "**/*.png",
    "*.jpg", "**/*.jpg",
    "*.jpeg", "**/*.jpeg",
    "*.webp", "**/*.webp",
    "*.dds", "**/*.dds",
    "*.ktx", "**/*.ktx",
    "*.ktx2", "**/*.ktx2",
    "*.otf", "**/*.otf",
    "*.ttf", "**/*.ttf",
]
